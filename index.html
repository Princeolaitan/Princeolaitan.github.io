<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TA AES-256 | Trust-Adaptive Framework</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #171717; overflow-x: hidden; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .trust-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow">
        <header class="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-8 gap-6 border-b border-gray-100 pb-8">
            <div class="w-full lg:w-auto">
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-gray-900 flex items-center gap-3">
                    <i data-lucide="shield-check" class="text-emerald-600 w-7 h-7 sm:w-8 sm:h-8"></i>
                    TA AES-256 <span class="text-emerald-600">Framework</span>
                </h1>
                <p class="text-gray-500 text-xs sm:text-sm mt-1">MSc Research: Trust-Adaptive AES-256 Architecture</p>
            </div>

            <div class="flex items-center justify-between w-full lg:w-auto gap-2 sm:gap-4 p-3 sm:p-4 rounded-2xl bg-gray-50 border border-gray-200 shadow-sm">
                <div class="text-center px-2 sm:px-4">
                    <span class="text-[9px] uppercase font-bold text-gray-400 block mb-1 tracking-wider">Network Trust</span>
                    <div id="trust-display" class="text-xl sm:text-2xl font-bold text-emerald-600 flex items-center gap-2">
                        <i data-lucide="activity" class="w-4 h-4 sm:w-5 sm:h-5 trust-pulse"></i>
                        <span id="trust-value">85</span>%
                    </div>
                </div>
                <div class="w-px h-8 sm:h-10 bg-gray-200"></div>
                <div class="px-2 sm:px-4">
                    <span class="text-[9px] uppercase font-bold text-gray-400 block mb-1 tracking-wider">Security Level</span>
                    <span class="text-xs sm:text-sm font-bold text-gray-800">AES-256-CBC</span>
                </div>
            </div>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8">
            <div class="lg:col-span-8 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
                    <div class="space-y-2">
                        <label class="text-[10px] uppercase font-black text-gray-400 ml-1 tracking-wider">Transmission Input</label>
                        <textarea id="input-text" class="w-full min-h-[250px] lg:h-[45vh] bg-gray-50 border border-gray-200 rounded-2xl p-4 focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 outline-none text-sm mono text-gray-800 transition-all shadow-inner" placeholder="Enter plaintext or encrypted bundle..."></textarea>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] uppercase font-black text-gray-400 ml-1 tracking-wider">Processed Output</label>
                        <textarea id="output-text" readonly class="w-full min-h-[250px] lg:h-[45vh] bg-gray-50 border border-gray-200 rounded-2xl p-4 text-sm mono text-gray-600 outline-none shadow-inner" placeholder="Results appear here..."></textarea>
                    </div>
                </div>

                <div class="bg-white border border-gray-200 rounded-2xl p-4 sm:p-6 shadow-sm">
                    <div class="flex flex-col md:flex-row gap-4 items-end">
                        <div class="flex-1 w-full space-y-2">
                            <label class="text-[10px] uppercase font-bold text-gray-400 ml-1">Contextual Authorization Key</label>
                            <div class="relative">
                                <i data-lucide="key" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                                <input id="password" type="password" value="ETA-Secure-2024" class="w-full bg-gray-50 border border-gray-200 rounded-xl py-4 pl-10 pr-4 outline-none focus:border-emerald-500 transition-colors text-gray-800 font-medium">
                            </div>
                        </div>
                        <div class="flex flex-col sm:flex-row gap-2 w-full md:w-auto">
                            <button onclick="processETA('encrypt')" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 px-8 rounded-xl transition-all shadow-lg shadow-emerald-100 flex items-center justify-center gap-2">
                                <i data-lucide="zap" class="w-4 h-4"></i> Encrypt
                            </button>
                            <button onclick="processETA('decrypt')" class="w-full sm:w-auto bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-4 px-8 rounded-xl transition-all flex items-center justify-center gap-2 border border-gray-200">
                                <i data-lucide="unlock" class="w-4 h-4"></i> Decrypt
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-4 space-y-6">
                <div class="bg-gray-50 border border-gray-200 rounded-2xl p-6">
                    <h3 class="text-[10px] font-bold uppercase tracking-widest text-gray-400 mb-4 flex items-center gap-2">
                        <i data-lucide="layers" class="text-emerald-600 w-4 h-4"></i> Payload Micro-Fragments
                    </h3>
                    <div id="fragment-list" class="space-y-2 max-h-[300px] overflow-y-auto pr-2 text-[10px] mono">
                        <div class="text-gray-400 italic">No active fragments generated.</div>
                    </div>
                </div>

                <div class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm">
                    <div class="grid grid-cols-2 lg:grid-cols-1 gap-3">
                        <button onclick="document.getElementById('file-upload').click()" class="bg-gray-50 hover:bg-gray-100 p-4 rounded-xl flex items-center lg:justify-start justify-center gap-3 transition-all border border-gray-200 group text-gray-700">
                            <i data-lucide="upload-cloud" class="w-5 h-5 group-hover:text-emerald-600"></i>
                            <span class="text-[10px] font-bold">IMPORT FILE</span>
                        </button>
                        <input type="file" id="file-upload" class="hidden" onchange="handleFileUpload(event)">
                        
                        <button onclick="handleDownload()" class="bg-gray-50 hover:bg-gray-100 p-4 rounded-xl flex items-center lg:justify-start justify-center gap-3 transition-all border border-gray-200 group text-gray-700">
                            <i data-lucide="save" class="w-5 h-5 group-hover:text-emerald-600"></i>
                            <span class="text-[10px] font-bold">EXPORT DATA</span>
                        </button>

                        <button onclick="swapTexts()" class="col-span-2 lg:col-span-1 bg-gray-100 hover:bg-gray-200 p-3 rounded-xl flex items-center justify-center gap-2 transition-all border border-gray-200 text-[10px] font-bold text-gray-600">
                            <i data-lucide="refresh-cw" class="w-3 h-3"></i> SWAP BUFFERS
                        </button>
                    </div>
                </div>

                <div class="bg-emerald-50 border border-emerald-100 rounded-2xl p-4 shadow-sm">
                    <div class="text-[9px] uppercase font-bold text-emerald-700 mb-1 tracking-widest">System Engine</div>
                    <div id="status-msg" class="text-xs mono text-emerald-800 break-words font-medium">Ready for transmission...</div>
                </div>
            </div>
        </main>
    </div>

    <footer class="w-full bg-white border-t border-gray-100 py-6 mt-8 text-center">
        <p class="text-gray-400 text-[9px] sm:text-[10px] uppercase tracking-[0.4em] px-4">
            TA-AES-256: Trust-Adaptive Framework • Saheed Yusuf Olaitan
        </p>
    </footer>

    <script>
        lucide.createIcons();
        let currentTrustScore = 85;

        setInterval(() => {
            const fluctuation = Math.floor(Math.random() * 11) - 5;
            currentTrustScore = Math.max(10, Math.min(100, currentTrustScore + fluctuation));
            document.getElementById('trust-value').innerText = currentTrustScore;
            const display = document.getElementById('trust-display');
            if (currentTrustScore < 40) display.className = "text-xl sm:text-2xl font-bold text-rose-600 flex items-center gap-2";
            else if (currentTrustScore < 70) display.className = "text-xl sm:text-2xl font-bold text-amber-600 flex items-center gap-2";
            else display.className = "text-xl sm:text-2xl font-bold text-emerald-600 flex items-center gap-2";
        }, 5000);

        function setStatus(msg) { document.getElementById('status-msg').innerText = msg; }

        async function processETA(mode) {
            const input = document.getElementById('input-text').value.trim();
            const password = document.getElementById('password').value;
            const outputArea = document.getElementById('output-text');
            const fragList = document.getElementById('fragment-list');

            if (!input || !password) { setStatus("Error: Required fields missing"); return; }
            setStatus(mode === 'encrypt' ? "Fragmenting Payload..." : "Authorizing Context...");

            try {
                if (mode === 'encrypt') {
                    const salt = CryptoJS.lib.WordArray.random(128 / 8);
                    const iterations = currentTrustScore < 40 ? 5000 : 2000;
                    const key = CryptoJS.PBKDF2(password, salt, { keySize: 256 / 32, iterations: iterations });
                    const iv = CryptoJS.lib.WordArray.random(128 / 8);
                    const encrypted = CryptoJS.AES.encrypt(input, key, { iv: iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                    const ciphertext = encrypted.toString();
                    
                    const numFrags = currentTrustScore < 50 ? 8 : 4;
                    const fragSize = Math.ceil(ciphertext.length / numFrags);
                    fragList.innerHTML = '';
                    
                    for (let i = 0, count = 1; i < ciphertext.length; i += fragSize, count++) {
                        const chunk = ciphertext.substring(i, i + fragSize);
                        const div = document.createElement('div');
                        div.className = "bg-white p-3 rounded-lg border border-gray-200 text-gray-500 truncate mb-2 shadow-sm";
                        div.innerHTML = `<span class="text-emerald-600 font-bold mr-2">#${count}</span> ${chunk}`;
                        fragList.appendChild(div);
                    }

                    const bundle = { ct: ciphertext, iv: iv.toString(), s: salt.toString(), t: currentTrustScore };
                    outputArea.value = btoa(JSON.stringify(bundle));
                    setStatus("SUCCESS: Fragments Generated");
                } else {
                    let b;
                    try { b = JSON.parse(atob(input)); } catch (e) { throw new Error("Format Corrupted"); }
                    const salt = CryptoJS.enc.Hex.parse(b.s);
                    const iv = CryptoJS.enc.Hex.parse(b.iv);
                    const it = b.t < 40 ? 5000 : 2000;
                    const key = CryptoJS.PBKDF2(password, salt, { keySize: 256 / 32, iterations: it });
                    const decrypted = CryptoJS.AES.decrypt(b.ct, key, { iv: iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                    const original = decrypted.toString(CryptoJS.enc.Utf8);
                    if (!original) throw new Error("Access Denied: Key/Trust Mismatch");
                    outputArea.value = original;
                    fragList.innerHTML = '<div class="text-gray-400 italic">No active fragments.</div>';
                    setStatus("SUCCESS: Data Reassembled");
                }
            } catch (e) {
                setStatus("CRITICAL ERROR: " + e.message);
                outputArea.value = "";
                fragList.innerHTML = '<div class="text-rose-600 font-bold italic">Integrity Check Failed</div>';
            }
        }

        function handleFileUpload(e) {
            const f = e.target.files[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = (ev) => { document.getElementById('input-text').value = ev.target.result; setStatus("Loaded: " + f.name); };
            r.readAsText(f);
        }

        function handleDownload() {
            const c = document.getElementById('output-text').value;
            if (!c) return;
            const blob = new Blob([c], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ETA_TRANS_${Date.now()}.txt`;
            a.click();
        }

        function swapTexts() {
            const i = document.getElementById('input-text');
            const o = document.getElementById('output-text');
            const t = i.value; i.value = o.value; o.value = t;
            setStatus("I/O Channels Swapped");
        }
    </script>
</body>
</html>
